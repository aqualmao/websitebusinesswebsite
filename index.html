<body>

<div class="site-header">

    <p style="padding-top:10px;text-align:center;">kingaidyn</p>
    <div style="text-align:center;">
        <a class="active" href="index">homepage</a>

        <a class="inactive" href="services">services</a>
        <a>-</a>
        <a class="inactive" href="contact">contact</a>
    </div>
    <hr>
</div>

<div class="container">
    <nav class="orbit-stage" aria-label="Explore kingaidyn's website">
        <img class="opening-image" src="pfp.png" alt="">
        <a class="orbit-link orbit-link-1" href="mailto:kingaidynmgmt@gmail.com" data-message="email for collab or sponsorship inquiries&#10;kingaidynmgmt@gmail.com" aria-label="Visit the website overview">
            <img src="email.png" alt="email">
        </a>
        <a class="orbit-link orbit-link-2" href="https://www.youtube.com/@kingaidyn" data-message="my only youtube channel" aria-label="my only youtube channel">
            <img src="youtube.png" alt="youtube">
        </a>
        <a class="orbit-link orbit-link-3" href="https://www.rednote.com/user/profile/6abf0eba0000000001005000" data-message="my only rednote page" aria-label="my only rednote page">
            <img src="rednote.png" alt="rednote">
        </a>
        <a class="orbit-link orbit-link-4" href="https://www.instagram.com/_kingaidyn/" data-message="my only instagram page" aria-label="my only instagram page">
            <img src="insta.png" alt="instagram">
        </a>
        <a class="orbit-link orbit-link-5" href="https://www.tiktok.com/@kingaidyn" data-message="my only tiktok page" aria-label="my only tiktok page">
            <img src="tiktok.png" alt="tiktok">
        </a>
    </nav>
    <div class="announcement" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

<script>
    const announcement = document.querySelector(".announcement");
    const orbitLinks = document.querySelectorAll(".orbit-link");

    orbitLinks.forEach((link) => {
        const showAnnouncement = () => {
            announcement.textContent = link.dataset.message;
            announcement.classList.add("is-visible");
        };
        const hideAnnouncement = () => {
            if (!link.matches(":hover, :focus-visible")) {
                announcement.classList.remove("is-visible");
            }
        };

        link.addEventListener("mouseenter", showAnnouncement);
        link.addEventListener("mouseleave", hideAnnouncement);
        link.addEventListener("focus", showAnnouncement);
        link.addEventListener("blur", hideAnnouncement);
    });
</script>
    
</body>

    </html>
